set $mode_shutdown "\
<span foreground='$mode_accent'>&#xf011; <b>Power</b></span> \
<span foreground='$mode_text'>│</span> \
<span foreground='$mode_text'>Lock</span> <span foreground='$mode_key'>(<b>l</b>)</span> \
<span foreground='$mode_text'>Logout</span> <span foreground='$mode_key'>(<b>e</b>)</span> \
<span foreground='$mode_text'>Suspend</span> <span foreground='$mode_key'>(<b>u</b>)</span> \
<span foreground='$mode_text'>Hibernate</span> <span foreground='$mode_key'>(<b>h</b>)</span> \
<span foreground='$mode_text'>Reboot</span> <span foreground='$mode_key'>(<b>r</b>)</span> \
<span foreground='$mode_text'>Shutdown</span> <span foreground='$mode_key'>(<b>s</b>)</span> \
<span foreground='$mode_text'>Exit</span> <span foreground='$mode_key'>(<b>Esc</b>)</span>"

mode --pango_markup $mode_shutdown {
    $bindsym l mode "default", exec $locking
    $bindsym e mode "default", exec loginctl terminate-user $USER
    $bindsym u mode "default", exec systemctl suspend
    $bindsym h mode "default", exec systemctl hibernate
    $bindsym r mode "default", exec systemctl reboot
    $bindsym s mode "default", exec systemctl poweroff

    $bindsym Return mode "default"
    $bindsym Escape mode "default"
}

$bindsym $mod+Shift+e mode $mode_shutdown

$bindsym $mod+Ctrl+l exec $locking
