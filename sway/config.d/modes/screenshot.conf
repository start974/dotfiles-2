set $mode_screenshot "\
<span foreground='$mode_accent'>&#xf030; <b>Screenshot</b></span> \
<span foreground='$mode_text'>│</span> \
<span foreground='$mode_text'>Screen</span> <span foreground='$mode_key'>(<b>s</b>)</span> \
<span foreground='$mode_text'>Region</span> <span foreground='$mode_key'>(<b>g</b>)</span> \
<span foreground='$mode_text'>Exit</span> <span foreground='$mode_key'>(<b>Esc</b>)</span>"

set $screenshot_screen grim - | wl-copy
set $screenshot_geometry grim -g "$(slurp -d)" - | wl-copy

mode --pango_markup $mode_screenshot {
    $bindsym s mode "default", exec $screenshot_screen
    $bindsym g mode "default", exec $screenshot_geometry

    $bindsym Return mode "default"
    $bindsym Escape mode "default"
}

$bindsym Print mode $mode_screenshot
