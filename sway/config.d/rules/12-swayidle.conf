exec swayidle -w \
    timeout 270 'notify-send -u critical -t 30000 -r 9999 "Auto-lock warning" "Screen will lock in 30 seconds"' \
         resume 'swaync-client -C' \
    timeout 300 '$locking' \
    timeout 600 'swaymsg "output * dpms off"' \
         resume 'swaymsg "output * dpms on"' \
    before-sleep '$locking'
